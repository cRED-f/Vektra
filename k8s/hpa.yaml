# ── HorizontalPodAutoscaler (HPA) ─────────────────────────────────────
# The whole point of k8s: scale UP when busy, scale DOWN when idle.
# This watches the backend's CPU usage and adjusts `replicas` automatically.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vektra-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vektra-backend        # which Deployment we autoscale
  minReplicas: 2                # never go below 2
  maxReplicas: 8                # never exceed 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60  # keep avg CPU at 60%; add pods as it rises
  # NOTE: CPU-based HPA needs the "metrics-server" addon in the cluster.
  # Without it the HPA shows the target but reports "unable to fetch metrics".
  # For queue-depth scaling you'd add prometheus-adapter (see plans).