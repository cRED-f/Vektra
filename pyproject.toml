[project]
name = "vektra"
version = "0.1.0"
description = "Production retrieval + model serving platform"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Settings & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",

    # HTTP client (Ollama, etc.)
    "httpx>=0.27.0",

    # Observability
    "prometheus-client>=0.21.0",

    # Ingestion (M1 — added now, used later)
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "markdownify>=0.14.0",

    # Retrieval (M2)
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.1.0",

    # SSE streaming
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",  # for TestClient
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["TCH001"]  # allow runtime TYPE_CHECKING imports

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests needing Docker (deselect with '-m not integration')",
]
